name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check website
        run: |
          node --check catalog.js
          node --check script.js
          node --check customer-tools.js
          node check.cjs
      - name: Prepare public files
        run: |
          mkdir -p _site/assets/generated
          cp index.html styles.css catalog.js script.js customer-tools.js _site/
          cp assets/logo.webp _site/assets/
          cp assets/generated/*.jpg _site/assets/generated/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
